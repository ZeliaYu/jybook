<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c0e12">
<meta name="mobile-web-app-capable" content="yes">
<title>记一笔</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0c0e12;
  --surface: #151820;
  --surface-2: #1c2029;
  --surface-3: #242933;
  --border: #2a303c;
  --accent: #5eead4;
  --accent-dim: #2dd4a830;
  --accent-glow: #5eead440;
  --danger: #fb7185;
  --danger-dim: #fb718525;
  --warn: #fbbf24;
  --text: #e8eaed;
  --text-2: #9ba3b0;
  --text-3: #5f6777;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 2px 16px #00000050;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:15px; }
body {
  font-family: system-ui, -apple-system, 'HarmonyOS Sans SC', 'MiSans', 'Noto Sans CJK SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: 80px;
  -webkit-tap-highlight-color: transparent;
}
input, select, textarea, button { font-family: inherit; font-size: inherit; }

/* ============ NAV ============ */
.nav {
  position: fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px; z-index:100;
  background: var(--surface);
  border-top:1px solid var(--border);
  display:flex; justify-content:space-around; align-items:center;
  padding: 8px 0 max(8px, env(safe-area-inset-bottom));
}
.nav-item {
  display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 16px; border-radius:var(--radius-sm); cursor:pointer;
  color:var(--text-3); transition:all .2s; border:none; background:none;
}
.nav-item.active { color:var(--accent); }
.nav-item span { font-size:10px; font-weight:500; letter-spacing:.03em; }
.nav-item svg { width:22px; height:22px; }

/* ============ PAGES ============ */
.page { display:none; padding:0 20px; animation:fadeUp .3s ease; }
.page.active { display:block; }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

/* ============ HEADER ============ */
.header {
  padding: 24px 0 16px;
  display: flex; justify-content:space-between; align-items:center;
}
.header h1 { font-size:1.6rem; font-weight:700; letter-spacing:-.02em; }
.header-date {
  font-size:.8rem; color:var(--text-2);
  font-family:'JetBrains Mono','Roboto Mono',monospace;
}
.month-nav {
  display:flex; align-items:center; gap:12px; padding:4px 0 20px;
}
.month-nav button {
  width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--text-2); cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .2s;
}
.month-nav button:active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
.month-nav .month-label {
  font-weight:500; font-size:1rem; min-width:120px; text-align:center;
}

/* ============ OVERVIEW CARD ============ */
.overview-card {
  background: linear-gradient(135deg, #1a2e38 0%, #152028 100%);
  border:1px solid #2a4a5450;
  border-radius:var(--radius); padding:24px; margin-bottom:20px;
  position:relative; overflow:hidden;
}
.overview-card::before {
  content:''; position:absolute; top:-30px; right:-30px;
  width:120px; height:120px; border-radius:50%;
  background:radial-gradient(circle, var(--accent-glow), transparent 70%);
}
.overview-label { font-size:.8rem; color:var(--text-2); margin-bottom:8px; }
.overview-amount {
  font-size:2.2rem; font-weight:700; font-family:'JetBrains Mono','Roboto Mono',monospace;
  letter-spacing:-.03em; position:relative;
}
.overview-amount::before { content:'¥'; font-size:1.2rem; margin-right:2px; opacity:.6; }
.overview-stats {
  display:flex; gap:20px; margin-top:16px; padding-top:16px;
  border-top:1px solid #ffffff10;
}
.stat-item { flex:1; }
.stat-label { font-size:.7rem; color:var(--text-3); margin-bottom:4px; }
.stat-value {
  font-size:1.05rem; font-weight:500; font-family:'JetBrains Mono','Roboto Mono',monospace;
}
.stat-value.income { color:var(--accent); }
.stat-value.expense { color:var(--danger); }

/* ============ CATEGORY LIST ============ */
.section-title {
  font-size:.85rem; color:var(--text-2); margin:20px 0 12px;
  font-weight:500; letter-spacing:.02em;
}
.cat-bar-list { display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
.cat-bar-item {
  display:flex; align-items:center; gap:12px; padding:12px 14px;
  background:var(--surface); border-radius:var(--radius-sm);
  transition:all .15s;
}
.cat-bar-icon {
  width:38px; height:38px; border-radius:10px; display:flex;
  align-items:center; justify-content:center; font-size:1.15rem;
  flex-shrink:0;
}
.cat-bar-info { flex:1; min-width:0; }
.cat-bar-name { font-size:.85rem; font-weight:500; }
.cat-bar-detail {
  font-size:.7rem; color:var(--text-3); margin-top:2px;
  font-family:'JetBrains Mono','Roboto Mono',monospace;
}
.cat-bar-pct { font-size:.75rem; color:var(--text-2); font-weight:500; flex-shrink:0; }
.cat-bar-track {
  flex:1; height:4px; background:var(--surface-3); border-radius:4px;
  overflow:hidden; min-width:40px;
}
.cat-bar-fill {
  height:100%; border-radius:4px; transition:width .5s ease;
}

/* ============ RECORDS PAGE ============ */
.day-group { margin-bottom:20px; }
.day-header {
  font-size:.8rem; color:var(--text-3); margin-bottom:8px;
  font-family:'JetBrains Mono','Roboto Mono',monospace; font-weight:400;
}
.day-total { color:var(--danger); margin-left:8px; }
.record-item {
  display:flex; align-items:center; gap:12px; padding:14px;
  background:var(--surface); border-radius:var(--radius-sm);
  margin-bottom:6px; cursor:pointer; transition:all .15s;
}
.record-item:active { background:var(--surface-2); }
.record-icon {
  width:40px; height:40px; border-radius:11px; display:flex;
  align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0;
}
.record-info { flex:1; min-width:0; }
.record-cat { font-size:.9rem; font-weight:500; }
.record-note {
  font-size:.72rem; color:var(--text-3); margin-top:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.record-amount {
  font-size:1rem; font-weight:500; font-family:'JetBrains Mono','Roboto Mono',monospace;
  color:var(--danger); flex-shrink:0;
}
.record-time {
  font-size:.65rem; color:var(--text-3); text-align:right; margin-top:2px;
  font-family:'JetBrains Mono','Roboto Mono',monospace;
}
.empty-state {
  text-align:center; padding:60px 20px; color:var(--text-3);
}
.empty-state .empty-icon { font-size:3rem; margin-bottom:12px; }
.empty-state p { font-size:.85rem; }

/* ============ ADD PAGE ============ */
.add-header {
  text-align:center; padding:24px 0 8px;
}
.add-header h2 { font-size:1.3rem; font-weight:700; }

.amount-display {
  text-align:center; padding:24px 0 28px;
}
.amount-display input {
  width:100%; text-align:center; font-size:2.8rem; font-weight:700;
  font-family:'JetBrains Mono','Roboto Mono',monospace; background:none; border:none;
  color:var(--text); outline:none; letter-spacing:-.02em;
}
.amount-display input::placeholder { color:var(--text-3); }

.type-tabs {
  display:flex; gap:8px; margin-bottom:24px;
  background:var(--surface); padding:4px; border-radius:var(--radius-sm);
}
.type-tab {
  flex:1; padding:10px; text-align:center; border-radius:8px;
  font-size:.85rem; font-weight:500; cursor:pointer;
  border:none; background:none; color:var(--text-2); transition:all .2s;
}
.type-tab.active { background:var(--accent-dim); color:var(--accent); }

.cat-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
  margin-bottom:24px;
}
.cat-btn {
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:14px 4px; border-radius:var(--radius-sm); cursor:pointer;
  border:2px solid transparent; background:var(--surface);
  transition:all .2s; position:relative;
}
.cat-btn:active { transform:scale(.95); }
.cat-btn.selected { border-color:var(--accent); background:var(--accent-dim); }
.cat-btn .emoji { font-size:1.4rem; }
.cat-btn .name { font-size:.7rem; color:var(--text-2); }

.add-field {
  margin-bottom:16px;
}
.add-field label { font-size:.78rem; color:var(--text-2); margin-bottom:6px; display:block; }
.add-field input, .add-field textarea, .add-field select {
  width:100%; padding:12px 14px; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text); outline:none; transition:border-color .2s;
}
.add-field input:focus, .add-field textarea:focus, .add-field select:focus {
  border-color:var(--accent);
}
.add-field textarea { resize:none; height:60px; }
.add-field select { appearance:none; cursor:pointer; }

.btn-primary {
  width:100%; padding:16px; border-radius:var(--radius-sm);
  background:var(--accent); color:var(--bg); font-weight:700;
  font-size:1rem; border:none; cursor:pointer; transition:all .2s;
  letter-spacing:.02em;
}
.btn-primary:active { transform:scale(.98); opacity:.9; }

.btn-outline {
  width:100%; padding:14px; border-radius:var(--radius-sm);
  background:none; color:var(--text-2); font-weight:500;
  font-size:.9rem; border:1px dashed var(--border); cursor:pointer;
  transition:all .2s;
}
.btn-outline:active { border-color:var(--accent); color:var(--accent); }

/* ============ CATEGORY MGMT ============ */
.cat-mgmt-item {
  display:flex; align-items:center; gap:12px; padding:14px;
  background:var(--surface); border-radius:var(--radius-sm);
  margin-bottom:8px;
}
.cat-mgmt-item .emoji { font-size:1.5rem; }
.cat-mgmt-item .info { flex:1; }
.cat-mgmt-item .info .name { font-weight:500; font-size:.9rem; }
.cat-mgmt-item .info .budget {
  font-size:.72rem; color:var(--text-3); margin-top:2px;
  font-family:'JetBrains Mono','Roboto Mono',monospace;
}
.cat-mgmt-actions { display:flex; gap:6px; }
.cat-mgmt-actions button {
  width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text-2); cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .15s;
}
.cat-mgmt-actions button:active { border-color:var(--accent); color:var(--accent); }
.cat-mgmt-actions button.del:active { border-color:var(--danger); color:var(--danger); }

/* ============ MODAL ============ */
.modal-overlay {
  position:fixed; inset:0; background:#00000080; z-index:200;
  display:none; align-items:flex-end; justify-content:center;
  animation:fadeIn .2s;
}
.modal-overlay.show { display:flex; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  width:100%; max-width:480px; background:var(--surface);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:24px 20px max(24px, env(safe-area-inset-bottom));
  animation:slideUp .3s ease;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-title { font-size:1.1rem; font-weight:700; margin-bottom:20px; text-align:center; }

.emoji-picker {
  display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;
  max-height:180px; overflow-y:auto; padding:4px;
}
.emoji-opt {
  width:44px; height:44px; border-radius:10px; display:flex;
  align-items:center; justify-content:center; font-size:1.4rem;
  cursor:pointer; border:2px solid transparent; background:var(--surface-2);
  transition:all .15s;
}
.emoji-opt.selected { border-color:var(--accent); background:var(--accent-dim); }

/* ============ PIE CHART ============ */
.pie-wrap {
  display:flex; align-items:center; justify-content:center; gap:24px;
  margin:20px 0; flex-wrap:wrap;
}
.pie-svg { width:160px; height:160px; flex-shrink:0; }
.pie-legend { display:flex; flex-direction:column; gap:6px; }
.legend-item { display:flex; align-items:center; gap:8px; font-size:.78rem; }
.legend-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }

/* ============ CHART TOGGLE ============ */
.chart-toggle {
  display:flex; gap:8px; margin-bottom:16px;
}
.chart-toggle button {
  padding:7px 16px; border-radius:20px; font-size:.78rem; font-weight:500;
  border:1px solid var(--border); background:none; color:var(--text-2);
  cursor:pointer; transition:all .2s;
}
.chart-toggle button.active { background:var(--accent-dim); color:var(--accent); border-color:var(--accent); }

/* ============ TOAST ============ */
.toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  background:var(--accent); color:var(--bg); padding:10px 24px;
  border-radius:24px; font-size:.85rem; font-weight:600;
  z-index:999; opacity:0; transition:opacity .3s; pointer-events:none;
}
.toast.show { opacity:1; }

/* ============ SCROLL ============ */
::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* ============ DELETE CONFIRM ============ */
.del-confirm {
  display:flex; gap:10px; margin-top:16px;
}
.del-confirm button {
  flex:1; padding:12px; border-radius:var(--radius-sm);
  font-weight:600; font-size:.9rem; cursor:pointer; border:none; transition:all .15s;
}
.del-confirm .cancel { background:var(--surface-2); color:var(--text-2); }
.del-confirm .confirm { background:var(--danger); color:#fff; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ========== PAGE: HOME ========== -->
<div class="page" id="page-home">
  <div class="header">
    <h1>记一笔</h1>
    <div class="header-date" id="todayDate"></div>
  </div>

  <div class="month-nav">
    <button onclick="changeMonth(-1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="month-label" id="monthLabel"></div>
    <button onclick="changeMonth(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="overview-card">
    <div class="overview-label">本月支出</div>
    <div class="overview-amount" id="monthTotal">0</div>
    <div class="overview-stats">
      <div class="stat-item">
        <div class="stat-label">笔数</div>
        <div class="stat-value" id="monthCount">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">日均</div>
        <div class="stat-value expense" id="monthDaily">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">最大单笔</div>
        <div class="stat-value expense" id="monthMax">0</div>
      </div>
    </div>
  </div>

  <div class="section-title">分类占比</div>
  <div id="catBreakdown"></div>

  <div class="section-title">最近记录</div>
  <div id="recentRecords"></div>
</div>

<!-- ========== PAGE: RECORDS ========== -->
<div class="page active" id="page-records">
  <div class="header"><h1>记录</h1></div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="month-label" id="monthLabel2"></div>
    <button onclick="changeMonth(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
  <div id="recordsList"></div>
</div>

<!-- ========== PAGE: ADD ========== -->
<div class="page" id="page-add">
  <div class="add-header"><h2>记一笔</h2></div>
  <div class="amount-display">
    <input type="number" id="addAmount" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
  </div>
  <div class="type-tabs">
    <button class="type-tab active" data-type="expense" onclick="setAddType('expense')">支出</button>
    <button class="type-tab" data-type="income" onclick="setAddType('income')">收入</button>
  </div>
  <div class="section-title">选择分类</div>
  <div class="cat-grid" id="addCatGrid"></div>
  <div class="add-field">
    <label>备注</label>
    <textarea id="addNote" placeholder="今天花了什么？"></textarea>
  </div>
  <div class="add-field">
    <label>日期</label>
    <input type="date" id="addDate">
  </div>
  <button class="btn-primary" onclick="saveRecord()">保存记录</button>
</div>

<!-- ========== PAGE: STATS ========== -->
<div class="page" id="page-stats">
  <div class="header"><h1>统计</h1></div>
  <div class="chart-toggle">
    <button class="active" onclick="setChartRange('month',this)">本月</button>
    <button onclick="setChartRange('week',this)">本周</button>
    <button onclick="setChartRange('all',this)">全部</button>
  </div>
  <div class="pie-wrap">
    <svg class="pie-svg" id="pieChart" viewBox="0 0 160 160"></svg>
    <div class="pie-legend" id="pieLegend"></div>
  </div>
  <div class="section-title">分类明细</div>
  <div id="statsBreakdown"></div>
</div>

<!-- ========== PAGE: CATEGORIES ========== -->
<div class="page" id="page-cats">
  <div class="header"><h1>分类</h1></div>
  <div class="section-title">支出分类</div>
  <div id="catListExpense"></div>
  <div class="section-title">收入分类</div>
  <div id="catListIncome"></div>
  <div style="height:20px"></div>
  <button class="btn-outline" onclick="openCatModal()">+ 新建分类</button>

  <div class="section-title">数据备份</div>
  <p style="font-size:.75rem;color:var(--text-3);margin:-6px 0 12px;line-height:1.5">换手机或清除浏览器数据前，先导出备份文件；在新设备上导入即可恢复全部记录。</p>
  <button class="btn-outline" onclick="exportData()">↓ 导出数据（备份）</button>
  <div style="height:10px"></div>
  <button class="btn-outline" onclick="document.getElementById('importFile').click()">↑ 导入数据（恢复）</button>
  <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(this)">
</div>

<!-- ========== NAV ========== -->
<nav class="nav">
  <button class="nav-item" onclick="goPage('home',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
    <span>首页</span>
  </button>
  <button class="nav-item active" onclick="goPage('records',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
    <span>记录</span>
  </button>
  <button class="nav-item" onclick="goPage('add',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14m-7-7h14"/></svg>
    <span>记账</span>
  </button>
  <button class="nav-item" onclick="goPage('stats',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
    <span>统计</span>
  </button>
  <button class="nav-item" onclick="goPage('cats',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h.01M7 3h5a1.99 1.99 0 011.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
    <span>分类</span>
  </button>
</nav>

<!-- ========== MODAL: ADD/EDIT CATEGORY ========== -->
<div class="modal-overlay" id="catModal">
  <div class="modal">
    <div class="modal-title" id="catModalTitle">新建分类</div>
    <div class="add-field">
      <label>分类名称</label>
      <input id="catName" placeholder="例如：咖啡">
    </div>
    <div class="add-field">
      <label>选择图标</label>
    </div>
    <div class="emoji-picker" id="emojiPicker"></div>
    <div class="add-field">
      <label>类型</label>
      <select id="catType">
        <option value="expense">支出</option>
        <option value="income">收入</option>
      </select>
    </div>
    <button class="btn-primary" onclick="saveCat()">保存</button>
    <div style="height:8px"></div>
    <button class="btn-outline" onclick="closeCatModal()">取消</button>
  </div>
</div>

<!-- ========== MODAL: RECORD DETAIL ========== -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-title">记录详情</div>
    <div id="detailContent"></div>
    <div class="del-confirm">
      <button class="cancel" onclick="closeDetailModal()">关闭</button>
      <button class="confirm" onclick="deleteRecord()">删除记录</button>
    </div>
  </div>
</div>

<script>
// ====== DATA ======
const DEFAULT_CATS = [
  {id:'food',name:'餐饮',icon:'🍜',type:'expense'},
  {id:'transport',name:'交通',icon:'🚇',type:'expense'},
  {id:'shopping',name:'购物',icon:'🛍️',type:'expense'},
  {id:'entertainment',name:'娱乐',icon:'🎮',type:'expense'},
  {id:'medical',name:'医疗',icon:'💊',type:'expense'},
  {id:'education',name:'教育',icon:'📚',type:'expense'},
  {id:'housing',name:'住房',icon:'🏠',type:'expense'},
  {id:'daily',name:'日用',icon:'🧴',type:'expense'},
  {id:'social',name:'社交',icon:'🍻',type:'expense'},
  {id:'digital',name:'数码',icon:'📱',type:'expense'},
  {id:'pets',name:'宠物',icon:'🐱',type:'expense'},
  {id:'other_exp',name:'其他',icon:'📦',type:'expense'},
  {id:'salary',name:'工资',icon:'💰',type:'income'},
  {id:'bonus',name:'奖金',icon:'🎁',type:'income'},
  {id:'invest',name:'投资',icon:'📈',type:'income'},
  {id:'freelance',name:'兼职',icon:'💻',type:'income'},
  {id:'other_inc',name:'其他收入',icon:'💵',type:'income'},
];

const CAT_COLORS = [
  '#fb7185','#f472b6','#a78bfa','#818cf8','#60a5fa',
  '#38bdf8','#22d3ee','#2dd4bf','#34d399','#a3e635',
  '#facc15','#fb923c','#f87171','#e879f9','#c084fc',
];

const EMOJIS = [
  '🍜','🍔','🍕','🍣','☕','🧋','🍺','🍻','🍰',
  '🚇','🚌','✈️','🚗','⛽','🚲','🚶',
  '🛍️','👔','👟','💄','💍','🕶️',
  '🎮','🎬','🎵','📱','💻','📷','🖥️',
  '💊','🏥','💉',
  '📚','🎓','✏️',
  '🏠','💡','🔧','🧹',
  '🧴','🛒','🧺',
  '🐱','🐶','🐟',
  '💰','🎁','📈','💵','🏦','💳',
  '📦','🏷️','⭐','❤️','🔥','✨','🎯','🏆','🎪','🌟',
];

let data = {
  categories: [],
  records: [],
};

let currentMonth = new Date();
let currentYear, currentMonthNum;
let addType = 'expense';
let selectedCatId = null;
let editingCatId = null;
let selectedRecordId = null;
let chartRange = 'month';

function init() {
  currentYear = currentMonth.getFullYear();
  currentMonthNum = currentMonth.getMonth();

  const saved = (() => { try { return localStorage.getItem('jybook_data'); } catch(e) { return null; } })();
  if (saved) {
    try { data = JSON.parse(saved); } catch(e) {}
  }

  if (!data.categories || data.categories.length === 0) {
    data.categories = JSON.parse(JSON.stringify(DEFAULT_CATS));
  }
  if (!data.records) data.records = [];

  document.getElementById('todayDate').textContent = formatDate(new Date());
  document.getElementById('addDate').value = toDateString(new Date());

  renderAll();
}

function save() {
  try {
    localStorage.setItem('jybook_data', JSON.stringify(data));
  } catch(e) {
    toast('保存失败：浏览器存储不可用（可能是隐私模式）');
  }
}

// ====== NAV ======
function goPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  if (name === 'add') {
    renderAddCatGrid();
    document.getElementById('addDate').value = toDateString(new Date());
  }
  if (name === 'records') renderRecords();
  if (name === 'stats') renderStats();
  if (name === 'cats') renderCatMgmt();
  if (name === 'home') renderHome();
}

// ====== MONTH NAV ======
function changeMonth(delta) {
  currentMonth.setDate(1); // 先固定到1号，避免31号切换月份时日期溢出
  currentMonth.setMonth(currentMonth.getMonth() + delta);
  currentYear = currentMonth.getFullYear();
  currentMonthNum = currentMonth.getMonth();
  renderAll();
}

// ====== HELPERS ======
function toDateString(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatDate(d) {
  const weekdays = ['日','一','二','三','四','五','六'];
  return `${d.getMonth()+1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;
}
function formatMoney(n) {
  if (n === 0) return '0';
  return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
// 'YYYY-MM-DD' 按 UTC 解析会有时区偏移，这里手动按本地时区解析
function parseDate(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function catColor(cat) {
  const i = data.categories.indexOf(cat);
  return CAT_COLORS[(i === -1 ? 0 : i) % CAT_COLORS.length];
}
function getMonthRecords() {
  return data.records.filter(r => {
    const d = parseDate(r.date);
    return d.getFullYear() === currentYear && d.getMonth() === currentMonthNum;
  });
}
function getCatById(id) {
  return data.categories.find(c => c.id === id);
}
function getMonthLabel() {
  return `${currentYear}年${currentMonthNum + 1}月`;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ====== RENDER ALL ======
function renderAll() {
  const ml = getMonthLabel();
  document.getElementById('monthLabel').textContent = ml;
  document.getElementById('monthLabel2').textContent = ml;
  renderHome();
  // 记录页可见时同步刷新列表（切换月份、删除记录后）
  if (document.getElementById('page-records').classList.contains('active')) renderRecords();
}

// ====== HOME ======
function renderHome() {
  const recs = getMonthRecords();
  const expenses = recs.filter(r => r.type === 'expense');
  const total = expenses.reduce((s,r) => s + r.amount, 0);
  const daysInMonth = new Date(currentYear, currentMonthNum + 1, 0).getDate();
  const daysPassed = (currentYear === new Date().getFullYear() && currentMonthNum === new Date().getMonth())
    ? new Date().getDate() : daysInMonth;

  document.getElementById('monthTotal').textContent = formatMoney(total);
  document.getElementById('monthCount').textContent = expenses.length;
  document.getElementById('monthDaily').textContent = formatMoney(daysPassed > 0 ? total / daysPassed : 0);
  document.getElementById('monthMax').textContent = expenses.length > 0
    ? formatMoney(Math.max(...expenses.map(r => r.amount))) : '0';

  // Category breakdown
  const catMap = {};
  expenses.forEach(r => {
    catMap[r.catId] = (catMap[r.catId] || 0) + r.amount;
  });
  const sorted = Object.entries(catMap).sort((a,b) => b[1] - a[1]);
  const maxAmt = sorted.length > 0 ? sorted[0][1] : 1;

  let html = '';
  sorted.forEach(([catId, amt], i) => {
    const cat = getCatById(catId);
    if (!cat) return;
    const pct = total > 0 ? (amt / total * 100) : 0;
    const color = catColor(cat);
    html += `
      <div class="cat-bar-item">
        <div class="cat-bar-icon" style="background:${color}20">${cat.icon}</div>
        <div class="cat-bar-info">
          <div class="cat-bar-name">${esc(cat.name)}</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        </div>
        <div style="text-align:right">
          <div class="cat-bar-detail">¥${formatMoney(amt)}</div>
          <div class="cat-bar-pct">${pct.toFixed(1)}%</div>
        </div>
      </div>`;
  });
  if (sorted.length === 0) {
    html = '<div style="text-align:center;color:var(--text-3);padding:20px;font-size:.85rem">暂无记录</div>';
  }
  document.getElementById('catBreakdown').innerHTML = html;

  // Recent records（含收入，按时间倒序取最近5条）
  const recent = [...recs].sort((a,b) => b.date.localeCompare(a.date) || b.ts - a.ts).slice(0, 5);
  let rhtml = '';
  recent.forEach(r => {
    const cat = getCatById(r.catId);
    const color = cat ? catColor(cat) : CAT_COLORS[0];
    rhtml += `
      <div class="record-item" onclick="showDetail('${r.id}')">
        <div class="record-icon" style="background:${color}20">${cat ? cat.icon : '📦'}</div>
        <div class="record-info">
          <div class="record-cat">${cat ? esc(cat.name) : '已删除分类'}</div>
          <div class="record-note">${r.note ? esc(r.note) : '—'}</div>
        </div>
        <div style="text-align:right">
          <div class="record-amount" style="color:${r.type === 'income' ? 'var(--accent)' : 'var(--danger)'}">${r.type === 'income' ? '+' : '-'}¥${formatMoney(r.amount)}</div>
          <div class="record-time">${r.date}</div>
        </div>
      </div>`;
  });
  if (recent.length === 0) {
    rhtml = '<div class="empty-state"><div class="empty-icon">📝</div><p>还没有记录，去记一笔吧</p></div>';
  }
  document.getElementById('recentRecords').innerHTML = rhtml;
}

// ====== RECORDS PAGE ======
function renderRecords() {
  const recs = getMonthRecords().sort((a,b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  const grouped = {};
  recs.forEach(r => {
    if (!grouped[r.date]) grouped[r.date] = [];
    grouped[r.date].push(r);
  });

  if (Object.keys(grouped).length === 0) {
    document.getElementById('recordsList').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><p>这个月还没有记录</p></div>';
    return;
  }

  let html = '';
  Object.entries(grouped).forEach(([date, items]) => {
    const dayTotal = items.filter(r=>r.type==='expense').reduce((s,r) => s + r.amount, 0);
    const d = parseDate(date);
    const weekdays = ['日','一','二','三','四','五','六'];
    const dayTotalHtml = dayTotal > 0 ? ` <span class="day-total">-¥${formatMoney(dayTotal)}</span>` : '';
    html += `<div class="day-group">
      <div class="day-header">${d.getMonth()+1}月${d.getDate()}日 周${weekdays[d.getDay()]}${dayTotalHtml}</div>`;
    items.forEach(r => {
      const cat = getCatById(r.catId);
      const color = cat ? catColor(cat) : CAT_COLORS[0];
      const prefix = r.type === 'income' ? '+' : '-';
      const col = r.type === 'income' ? 'var(--accent)' : 'var(--danger)';
      html += `
        <div class="record-item" onclick="showDetail('${r.id}')">
          <div class="record-icon" style="background:${color}20">${cat ? cat.icon : '📦'}</div>
          <div class="record-info">
            <div class="record-cat">${cat ? esc(cat.name) : '已删除分类'}</div>
            <div class="record-note">${r.note ? esc(r.note) : '—'}</div>
          </div>
          <div style="text-align:right">
            <div class="record-amount" style="color:${col}">${prefix}¥${formatMoney(r.amount)}</div>
          </div>
        </div>`;
    });
    html += '</div>';
  });
  document.getElementById('recordsList').innerHTML = html;
}

// ====== ADD PAGE ======
function setAddType(type) {
  addType = type;
  document.querySelectorAll('.type-tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  selectedCatId = null;
  renderAddCatGrid();
}

function renderAddCatGrid() {
  const cats = data.categories.filter(c => c.type === addType);
  let html = '';
  cats.forEach(c => {
    html += `<div class="cat-btn ${selectedCatId === c.id ? 'selected' : ''}" onclick="pickCat('${c.id}')">
      <span class="emoji">${c.icon}</span>
      <span class="name">${esc(c.name)}</span>
    </div>`;
  });
  document.getElementById('addCatGrid').innerHTML = html;
}

function pickCat(id) {
  selectedCatId = id;
  renderAddCatGrid();
}

function saveRecord() {
  const amtStr = document.getElementById('addAmount').value;
  const amt = parseFloat(amtStr);
  if (!amt || amt <= 0) { toast('请输入金额'); return; }
  if (!selectedCatId) { toast('请选择分类'); return; }
  const note = document.getElementById('addNote').value.trim();
  const date = document.getElementById('addDate').value || toDateString(new Date());

  data.records.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    type: addType,
    catId: selectedCatId,
    amount: amt,
    note,
    date,
    ts: Date.now(),
  });
  save();

  document.getElementById('addAmount').value = '';
  document.getElementById('addNote').value = '';
  selectedCatId = null;
  renderAddCatGrid();
  toast('记录成功 ✓');
}

// ====== STATS ======
function setChartRange(range, el) {
  chartRange = range;
  document.querySelectorAll('.chart-toggle button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderStats();
}

function renderStats() {
  let recs;
  const now = new Date();
  if (chartRange === 'month') {
    recs = data.records.filter(r => {
      const d = parseDate(r.date);
      return d.getFullYear() === currentYear && d.getMonth() === currentMonthNum && r.type === 'expense';
    });
  } else if (chartRange === 'week') {
    const weekStart = new Date(now);
    weekStart.setDate(now.getDate() - (now.getDay() + 6) % 7); // 周一为一周起点
    weekStart.setHours(0,0,0,0);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 7);
    recs = data.records.filter(r => {
      const d = parseDate(r.date);
      return d >= weekStart && d < weekEnd && r.type === 'expense';
    });
  } else {
    recs = data.records.filter(r => r.type === 'expense');
  }

  const total = recs.reduce((s,r) => s + r.amount, 0);
  const catMap = {};
  recs.forEach(r => { catMap[r.catId] = (catMap[r.catId] || 0) + r.amount; });
  const sorted = Object.entries(catMap).sort((a,b) => b[1] - a[1]);

  // Pie chart
  const pie = document.getElementById('pieChart');
  const legend = document.getElementById('pieLegend');
  pie.innerHTML = '';
  legend.innerHTML = '';

  if (sorted.length === 0) {
    pie.innerHTML = '<text x="80" y="80" text-anchor="middle" dominant-baseline="central" fill="#5f6777" font-size="14">暂无数据</text>';
    document.getElementById('statsBreakdown').innerHTML = '';
    return;
  }

  let cumAngle = -90;
  const cx = 80, cy = 80, r = 70;
  sorted.forEach(([catId, amt], i) => {
    const pct = amt / total;
    const angle = pct * 360;
    const startAngle = cumAngle;
    const endAngle = cumAngle + angle;
    const startRad = (startAngle * Math.PI) / 180;
    const endRad = (endAngle * Math.PI) / 180;
    const x1 = cx + r * Math.cos(startRad);
    const y1 = cy + r * Math.sin(startRad);
    const x2 = cx + r * Math.cos(endRad);
    const y2 = cy + r * Math.sin(endRad);
    const largeArc = angle > 180 ? 1 : 0;
    const color = CAT_COLORS[i % CAT_COLORS.length];

    if (sorted.length === 1) {
      pie.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity="0.85"/>`;
    } else {
      pie.innerHTML += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc},1 ${x2},${y2} Z" fill="${color}" opacity="0.85"/>`;
    }
    cumAngle = endAngle;

    const cat = getCatById(catId);
    if (cat) {
      legend.innerHTML += `<div class="legend-item"><div class="legend-dot" style="background:${color}"></div>${cat.icon} ${esc(cat.name)} ${(pct*100).toFixed(1)}%</div>`;
    }
  });

  // Breakdown bars
  let bhtml = '';
  sorted.forEach(([catId, amt], i) => {
    const cat = getCatById(catId);
    if (!cat) return;
    const pct = total > 0 ? (amt / total * 100) : 0;
    const color = catColor(cat);
    bhtml += `
      <div class="cat-bar-item">
        <div class="cat-bar-icon" style="background:${color}20">${cat.icon}</div>
        <div class="cat-bar-info">
          <div class="cat-bar-name">${esc(cat.name)}</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;background:${color}"></div></div>
        </div>
        <div style="text-align:right">
          <div class="cat-bar-detail">¥${formatMoney(amt)}</div>
          <div class="cat-bar-pct">${pct.toFixed(1)}%</div>
        </div>
      </div>`;
  });
  document.getElementById('statsBreakdown').innerHTML = bhtml;
}

// ====== CATEGORY MANAGEMENT ======
function renderCatMgmt() {
  ['expense', 'income'].forEach(type => {
    const cats = data.categories.filter(c => c.type === type);
    const container = document.getElementById(type === 'expense' ? 'catListExpense' : 'catListIncome');
    let html = '';
    cats.forEach(c => {
      const recCount = data.records.filter(r => r.catId === c.id).length;
      html += `
        <div class="cat-mgmt-item">
          <span class="emoji">${c.icon}</span>
          <div class="info">
            <div class="name">${esc(c.name)}</div>
            <div class="budget">${recCount} 笔记录</div>
          </div>
          <div class="cat-mgmt-actions">
            <button onclick="editCat('${c.id}')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="del" onclick="deleteCat('${c.id}')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </button>
          </div>
        </div>`;
    });
    container.innerHTML = html;
  });
}

function openCatModal(editId) {
  editingCatId = editId || null;
  document.getElementById('catModal').classList.add('show');
  document.getElementById('catModalTitle').textContent = editId ? '编辑分类' : '新建分类';

  if (editId) {
    const cat = getCatById(editId);
    document.getElementById('catName').value = cat.name;
    document.getElementById('catType').value = cat.type;
  } else {
    document.getElementById('catName').value = '';
    document.getElementById('catType').value = 'expense';
  }

  renderEmojiPicker(editId ? getCatById(editId).icon : null);
}

function closeCatModal() {
  document.getElementById('catModal').classList.remove('show');
  editingCatId = null;
}

function renderEmojiPicker(selected) {
  let html = '';
  EMOJIS.forEach(e => {
    html += `<div class="emoji-opt ${selected === e ? 'selected' : ''}" onclick="pickEmoji(this,'${e}')">${e}</div>`;
  });
  document.getElementById('emojiPicker').innerHTML = html;
}

function pickEmoji(el, emoji) {
  document.querySelectorAll('.emoji-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

function saveCat() {
  const name = document.getElementById('catName').value.trim();
  if (!name) { toast('请输入分类名称'); return; }
  const type = document.getElementById('catType').value;
  const selectedEmoji = document.querySelector('.emoji-opt.selected');
  // 编辑时若图标不在预设列表里（无选中项），保留原图标
  const icon = selectedEmoji ? selectedEmoji.textContent
    : (editingCatId ? getCatById(editingCatId).icon : '📦');

  if (editingCatId) {
    const cat = getCatById(editingCatId);
    cat.name = name;
    cat.icon = icon;
    cat.type = type;
  } else {
    data.categories.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      name, icon, type,
    });
  }
  save();
  const wasEdit = !!editingCatId;
  closeCatModal();
  renderCatMgmt();
  toast(wasEdit ? '分类已更新' : '分类已创建');
  if (wasEdit && document.getElementById('page-stats').classList.contains('active')) renderStats();
}

function editCat(id) { openCatModal(id); }

function deleteCat(id) {
  const recCount = data.records.filter(r => r.catId === id).length;
  if (recCount > 0) {
    if (!confirm(`该分类下有 ${recCount} 笔记录，删除分类后记录会保留但无法显示。确定删除？`)) return;
  }
  data.categories = data.categories.filter(c => c.id !== id);
  save();
  renderCatMgmt();
  toast('分类已删除');
}

// ====== DATA EXPORT / IMPORT ======
function exportData() {
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    a.href = url;
    a.download = `记一笔备份_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    toast('备份文件已导出 ✓');
  } catch(e) {
    toast('导出失败：' + e.message);
  }
}

function importData(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!imported || !Array.isArray(imported.categories) || !Array.isArray(imported.records)) {
        toast('文件格式不对，请选择导出的备份文件');
        return;
      }
      const recCount = imported.records.length;
      const catCount = imported.categories.length;
      if (!confirm(`将导入 ${recCount} 笔记录、${catCount} 个分类，覆盖当前全部数据。确定继续？`)) return;
      data = { categories: imported.categories, records: imported.records };
      save();
      renderAll();
      if (document.getElementById('page-cats').classList.contains('active')) renderCatMgmt();
      toast(`导入成功：${recCount} 笔记录 ✓`);
    } catch(err) {
      toast('导入失败：文件无法解析');
    }
    // 清空 input，允许重复选择同一文件
    input.value = '';
  };
  reader.readAsText(file, 'utf-8');
}

// ====== DETAIL MODAL ======
function showDetail(id) {
  selectedRecordId = id;
  const r = data.records.find(x => x.id === id);
  if (!r) return;
  const cat = getCatById(r.catId);
  const prefix = r.type === 'income' ? '+' : '-';
  const col = r.type === 'income' ? 'var(--accent)' : 'var(--danger)';
  document.getElementById('detailContent').innerHTML = `
    <div style="text-align:center;padding:16px 0">
      <div style="font-size:2.4rem;margin-bottom:8px">${cat ? cat.icon : '❓'}</div>
      <div style="font-size:1.6rem;font-weight:700;font-family:'JetBrains Mono','Roboto Mono',monospace;color:${col}">${prefix}¥${formatMoney(r.amount)}</div>
      <div style="color:var(--text-2);margin-top:6px;font-size:.85rem">${cat ? cat.name : '已删除分类'}</div>
      ${r.note ? `<div style="color:var(--text-3);margin-top:4px;font-size:.8rem">${esc(r.note)}</div>` : ''}
      <div style="color:var(--text-3);margin-top:8px;font-size:.75rem;font-family:'JetBrains Mono','Roboto Mono',monospace">${r.date}</div>
    </div>`;
  document.getElementById('detailModal').classList.add('show');
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('show');
  selectedRecordId = null;
}

function deleteRecord() {
  if (!selectedRecordId) return;
  if (!confirm('确定要删除这条记录吗？')) return;
  data.records = data.records.filter(r => r.id !== selectedRecordId);
  save();
  closeDetailModal();
  renderAll();
  toast('记录已删除');
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) {
      m.classList.remove('show');
    }
  });
});

// ====== INIT ======
init();

// ====== PWA ======
if (('serviceWorker' in navigator) && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
